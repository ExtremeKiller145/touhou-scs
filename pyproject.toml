[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "touhou-scs"
version = "0.1.0"
description = "Touhou SCS - Spell Card System"
requires-python = ">=3.13"
dependencies = [
    "gmdbuilder>=0.2.0"
]

# Optional dependencies for development
[project.optional-dependencies]
dev = [
    "basedpyright",
    "ruff",
]

[tool.basedpyright]
typeCheckingMode = "strict"
reportAny = "none" # Allow implicit any types
reportExplicitAny = "none" # Allow explicit any types
reportMissingTypeStubs = "none"
venvPath = "."
venv = "venv"

[tool.ruff.lint]
ignore = [
    "E701",    # multiple statements on one line
    "E402",    # module level import not at top (intentional in main.py/test.py)
    "I001",    # import sort (not enforced on this project)
    "PLR1722", # use sys.exit() instead of exit() (guard scripts use exit() intentionally)
    "BLE001",  # blind exception catch (intentional in preview worker)
]

[tool.pytest.ini_options]
addopts = "-qv"
